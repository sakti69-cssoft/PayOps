name: PayOps verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24.15.0', cache: npm }
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run setup && docker compose config --quiet
      - run: npm run integration
      - run: docker build -t payops-ci .
      - run: npm run test:fault
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          {
            name: fault-results,
            path: test-results/,
            if-no-files-found: ignore,
          }
